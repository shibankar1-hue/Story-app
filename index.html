<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Mastermind</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument panel for the mind. Fixed rail of tools on desktop, scrolling tab strip on phones; each tool is one working surface. */
:root{
  --bg:#E9ECF1; --surface:#FFFFFF; --sunk:#F3F5F8; --line:#D3D8E1;
  --ink:#141B2B; --muted:#56607A; --accent:#C2410C; --accent-ink:#FFFFFF;
  --influence:#B45309; --desire:#BE123C; --biology:#15803D; --reason:#1D4ED8;
  --good:#15803D; --warn:#B45309; --bad:#B91C1C;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2B; --sunk:#111725; --line:#273146;
  --ink:#E6EAF2; --muted:#94A0B8; --accent:#F97316; --accent-ink:#1A0D03;
  --influence:#F59E0B; --desire:#FB7185; --biology:#4ADE80; --reason:#7AA2FF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2B; --sunk:#111725; --line:#273146;
  --ink:#E6EAF2; --muted:#94A0B8; --accent:#F97316; --accent-ink:#1A0D03;
  --influence:#F59E0B; --desire:#FB7185; --biology:#4ADE80; --reason:#7AA2FF;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.shell>*{min-width:0}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);
  padding-block:22px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.94rem}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.nav-group{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--muted)}

main{min-width:0;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.view{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-direction:column;gap:8px;max-width:68ch}
.lede{color:var(--muted);font-size:1.02rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:.92rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
label.field span.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);cursor:pointer;font-size:.92rem}
.check input{margin-top:4px;accent-color:var(--accent)}
.check:has(input:checked){border-color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.c-influence{color:var(--influence)} .c-desire{color:var(--desire)} .c-biology{color:var(--biology)} .c-reason{color:var(--reason)}
.bg-influence{background:var(--influence)} .bg-desire{background:var(--desire)} .bg-biology{background:var(--biology)} .bg-reason{background:var(--reason)}

/* Today */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.principle{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px}
.principle .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.principle h2{font-size:1.7rem}
.principle .tag{align-self:flex-start}
.meter{display:flex;flex-direction:column;gap:12px}
.meter-row{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%}
.protocol li{list-style:none}
.protocol{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.streak{font-family:var(--display);font-size:2.4rem;font-weight:800;line-height:1}

/* Radar */
.scan-out{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.marked{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:14px;line-height:1.75;max-height:420px;overflow:auto}
mark{background:transparent;color:inherit;border-bottom:2px solid;padding:0 1px}
mark.k-reciprocity,mark.k-commitment,mark.k-social,mark.k-liking,mark.k-authority,mark.k-scarcity{border-color:var(--influence);background:color-mix(in srgb,var(--influence) 14%,transparent)}
mark.k-fear{border-color:var(--biology);background:color-mix(in srgb,var(--biology) 14%,transparent)}
mark.k-tribal,mark.k-mimetic{border-color:var(--desire);background:color-mix(in srgb,var(--desire) 14%,transparent)}
mark.k-certainty{border-color:var(--reason);background:color-mix(in srgb,var(--reason) 14%,transparent)}
.gauge{display:flex;align-items:baseline;gap:10px}
.gauge b{font-family:var(--display);font-size:3rem;line-height:1}
.hit{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.hit:first-child{border-top:0;padding-top:0}
.hit-head{display:flex;justify-content:space-between;gap:8px;align-items:center}

/* Gym */
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:12px 14px;cursor:pointer}
.q-opt:hover:not(:disabled){border-color:var(--ink)}
.q-opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.q-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.q-opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}

/* Decision table */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
td input[type=number]{width:64px;padding:6px 8px}
td input[type=text]{min-width:140px;padding:6px 8px}
tfoot td{font-weight:700;font-family:var(--mono)}
.win{color:var(--good)}

/* Codex */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.card .src{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.card .use{font-size:.88rem;background:var(--sunk);border-radius:8px;padding:10px 12px}
.card .use b{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;display:block;color:var(--muted);font-weight:500;margin-bottom:2px}

/* Future */
.future{display:flex;flex-direction:column;gap:14px}
.f-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.f-item ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* Journal */
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.entry pre{white-space:pre-wrap;font-family:var(--body);margin:0;font-size:.9rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:.9rem;z-index:50;transition:opacity .2s}
.result{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.result ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.layer{display:flex;flex-direction:column;gap:8px}
.layer-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;
    padding-right:max(16px, env(safe-area-inset-right, 0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
  .brand-name,.rail-foot,.nav-group{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  .nav a{white-space:nowrap;padding:7px 10px;font-size:.88rem}
  .hero,.scan-out,.grid2,.grid3,.f-item{grid-template-columns:1fr}
  main{padding-block:20px 56px}
}
@media (max-width:520px){.checks{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="8" fill="var(--ink)"/>
        <circle cx="12" cy="12" r="3.2" fill="var(--influence)"/><circle cx="22" cy="12" r="3.2" fill="var(--desire)"/>
        <circle cx="12" cy="22" r="3.2" fill="var(--biology)"/><circle cx="22" cy="22" r="3.2" fill="var(--reason)"/>
      </svg>
      <span class="brand-name">Mastermind</span>
    </div>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <div class="rail-foot">Your entries stay in this browser. Nothing is sent anywhere.</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- storage (safe) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem("mm:"+k); return v==null ? (k in mem ? mem[k] : d) : JSON.parse(v);}catch(e){ return k in mem ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem("mm:"+k, JSON.stringify(v)); }catch(e){} }
};
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
const todayKey = () => new Date().toISOString().slice(0,10);
function dayIndex(){ const d=new Date(); return Math.floor((d - new Date(d.getFullYear(),0,0))/864e5) + d.getFullYear()*366; }

const PILLARS = {
  influence:{name:"Influence", book:"Cialdini · Influence: The Psychology of Persuasion"},
  desire:{name:"Desire", book:"Girard · Things Hidden Since the Foundation of the World"},
  biology:{name:"Biology", book:"Sapolsky · Behave"},
  reason:{name:"Reason", book:"Halpern · Thought and Knowledge"}
};

/* ---------- journal ---------- */
function journal(){ return store.get("journal", []); }
function saveEntry(tool, title, body, pillar){
  const j = journal(); j.unshift({id:Date.now(), date:new Date().toISOString(), tool, title, body, pillar});
  store.set("journal", j.slice(0,500)); markProtocol(tool); toast("Saved to journal");
}
function markProtocol(tool){
  const map={radar:"radar",desire:"desire",decoder:"decoder",gym:"gym",decide:"decide",journal:"journal"};
  const p = store.get("protocol:"+todayKey(), {}); if(map[tool]){ p[map[tool]]=true; store.set("protocol:"+todayKey(), p); }
  touchStreak();
}
function touchStreak(){
  const s = store.get("streak", {last:null,count:0}); const t = todayKey();
  if(s.last===t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.count = (s.last===y) ? s.count+1 : 1; s.last=t; store.set("streak", s);
}

/* =========================================================
   CODEX — distilled concepts from the four books
   ========================================================= */
const CODEX = [
 // Influence
 {p:"influence",t:"Click, whirr",s:"Cialdini, ch. 1",d:"Much of what we do runs on automatic shortcuts. One trigger feature (a price tag, a uniform, the word “because”) sets off a whole canned response. Shortcuts are usually useful, which is why people who profit from triggering them can hijack them so easily.",u:"When you notice you decided in under a second, ask which single cue did the deciding."},
 {p:"influence",t:"Contrast",s:"Cialdini, ch. 1",d:"We judge things against whatever we saw just before. A $300 sweater after a $1,500 suit feels cheap. An okay apartment after two awful ones feels great.",u:"Before you compare, ask: what was I shown first, and who picked the order?"},
 {p:"influence",t:"Reciprocation",s:"Cialdini, ch. 2",d:"We feel obliged to repay what we receive, even uninvited gifts and even when the return is far bigger than the gift. A concession works the same way: “rejection-then-retreat” gets a yes on the second, smaller ask.",u:"Take the gift if you like, then name it for what it is: a sales tool. A tactic creates no debt."},
 {p:"influence",t:"Commitment & consistency",s:"Cialdini, ch. 3",d:"Once we take a stand, especially in public, in writing, or with effort, we feel pressure to act in line with it. Small first commitments (the foot in the door) change our self-image and then pull bigger actions after them.",u:"Use the gut check: “Knowing what I know now, if I could go back, would I make the same choice?”"},
 {p:"influence",t:"Social proof",s:"Cialdini, ch. 4",d:"We decide what is correct by looking at what others do. The pull is strongest when we are uncertain and when the others are like us. Crowds can be manufactured, and a crowd that is itself uncertain can freeze, as in the bystander effect.",u:"Ask two things: is this crowd real, and are they better informed than I am?"},
 {p:"influence",t:"Liking",s:"Cialdini, ch. 5",d:"We say yes to people we like. Attractiveness, similarity, compliments, contact and cooperation, and association with good things all raise liking, and all can be staged.",u:"If you like someone unusually fast, separate the person from the deal and judge the deal alone."},
 {p:"influence",t:"Authority",s:"Cialdini, ch. 6",d:"Deference to authority runs deep (Milgram's subjects kept going). Its symbols work almost as well as the real thing: titles, clothes, cars, confident tone.",u:"Is this person truly an expert on this exact question? How honest can I expect them to be here? What do they gain?"},
 {p:"influence",t:"Scarcity",s:"Cialdini, ch. 7",d:"Things seem more valuable when they are rare or slipping away, and we hate losing freedoms. Newly scarce things, and things others are competing for, pull hardest. Scarcity also raises arousal, and arousal makes thinking worse.",u:"Notice the rush, then calm down. Ask whether you want it to use, or just to have."},
 // Desire
 {p:"desire",t:"Mimetic desire",s:"Girard, Book III ch. 1",d:"We rarely want things on our own. We want what a model wants. Desire is a triangle (me, the model, the object), even when it feels like a straight line from me to the thing.",u:"For any strong want, ask: who showed me this was desirable?"},
 {p:"desire",t:"External vs internal mediation",s:"Girard",d:"When the model is far away (a hero, a saint, a historical figure) imitation is safe and even inspiring. When the model is close (a colleague, a sibling, a peer online) we compete for the same objects, and admiration turns to rivalry.",u:"Choose models whose success cannot block yours, and models you can't fight over objects with."},
 {p:"desire",t:"Doubles and escalating rivalry",s:"Girard, Book III ch. 2",d:"Rivals imitate each other's desire, and then each other's hostility. The object fades and the rivals become mirror images, more and more alike the harder each insists on being different.",u:"In a feud, list what you are now doing just because they did it. Stop one of those things."},
 {p:"desire",t:"The scapegoat mechanism",s:"Girard, Book I ch. 1",d:"When mimetic rivalry spreads through a group, the “all against all” can turn into “all against one.” Uniting against a victim brings sudden peace, and the group then believes the victim really was the cause. Myths are told from the persecutors' side, so the mechanism stays hidden.",u:"Warning sign: a shared crisis, then sudden unanimity that one person or group is to blame."},
 {p:"desire",t:"Texts of persecution",s:"Girard, Book I ch. 5",d:"Accounts that describe a crisis, a crime blamed on someone, signs that mark the accused (being foreign, disabled, different) and then violence can be read for what really happened: a persecution told by the persecutors.",u:"Read viral outrage like a historian. Who tells the story, and who can't answer?"},
 {p:"desire",t:"Scandal (skandalon)",s:"Girard, Book III ch. 5",d:"A skandalon is a stumbling block. It is the model who is also an obstacle, and the more they block us, the more they fascinate us. Obsessive resentment is a sign we are caught.",u:"If someone you resent takes up your thoughts, treat it as a sign of imitation, not a sign they matter."},
 {p:"desire",t:"Renouncing rivalry",s:"Girard, Book II",d:"Girard reads the Gospels as the text that finally tells the story from the victim's side and exposes the scapegoat. The way out of violent mimesis is to give up retaliation and imitate a model who has no rivalry in them.",u:"Practice not retaliating in small things. It breaks the mirror."},
 // Biology
 {p:"biology",t:"Explain across timescales",s:"Sapolsky, ch. 1–10",d:"To explain any behavior, ask what happened in the brain a second before, what senses picked up minutes before, what hormones did hours before, how the brain changed over months, then go back through adolescence, childhood, the womb, genes, culture, and evolution. No single level is “the cause.”",u:"When someone shocks you, run the ladder before you judge. Use the Behavior Decoder."},
 {p:"biology",t:"Frontal cortex: doing the harder thing",s:"Sapolsky, ch. 2",d:"The prefrontal cortex lets you do the harder thing when it's the right thing. It is the brain's restraint and long-term planning. Stress, fatigue, alcohol, and hunger weaken it first.",u:"Make big decisions when you are rested and fed. The PFC is the first thing you lose."},
 {p:"biology",t:"Amygdala: fast threat",s:"Sapolsky, ch. 2",d:"The amygdala drives fear, anger, and threat detection, and it reacts before slower conscious reasoning catches up. It is also involved in fast, often unconscious, reactions to faces that look like “them.”",u:"First reactions are data about your amygdala, not verdicts about the world."},
 {p:"biology",t:"Dopamine is about anticipation",s:"Sapolsky, ch. 2",d:"Dopamine is less about pleasure than the anticipation of reward and motivation to pursue it. It spikes most for an uncertain reward, “maybe,” which is why intermittent reinforcement (slot machines, feeds) grips so hard.",u:"If a product rewards you unpredictably, it is training your dopamine system. Decide whether you consent."},

R.radar=()=>`
 <div class="view-head"><span class="eyebrow c-influence">Influence · with Girard, Sapolsky, Halpern</span><h1>Influence Radar</h1>
 <p class="lede">Paste any message: an ad, email, sales pitch, political post, or AI-written text. Radar marks the levers it pulls on you and gives a counter-move for each.</p></div>
 <div class="panel"><label class="field" for="radarIn">Message to scan <span class="hint">Loaded with an example scam pitch. Replace it with your own.</span>
   <textarea id="radarIn" style="min-height:170px">${esc(store.get("radarDraft", SAMPLE_PITCH))}</textarea></label>
   <div class="row"><button class="btn primary" id="scan">Scan message</button><button class="btn ghost" id="clearRadar">Clear</button></div></div>
 <div id="radarOut"></div>`;
function scanText(text){
  const ranges=[], counts={};
  for(const [k,def] of Object.entries(RADAR)){
    const seen=new Set();
    for(const re of def.re){ re.lastIndex=0; let m; while((m=re.exec(text))){ if(!m[0]){re.lastIndex++;continue;} ranges.push({s:m.index,e:m.index+m[0].length,k}); seen.add(m[0].toLowerCase()); counts[k]=(counts[k]||[]); counts[k].push(m[0]); } }
  }
  ranges.sort((a,b)=>a.s-b.s||b.e-a.e);
  const clean=[]; let last=-1; for(const r of ranges){ if(r.s>=last){clean.push(r); last=r.e;} }
  let html="", i=0; for(const r of clean){ html+=esc(text.slice(i,r.s))+`<mark class="k-${r.k}" title="${esc(RADAR[r.k].n)}">${esc(text.slice(r.s,r.e))}</mark>`; i=r.e; } html+=esc(text.slice(i));
  return {html, counts};
}
B.radar=()=>{
  const run=()=>{
    const text=$("#radarIn").value; store.set("radarDraft",text);
    if(!text.trim()){ $("#radarOut").innerHTML=""; return; }
    const {html,counts}=scanText(text);
    const keys=Object.keys(counts).sort((a,b)=>counts[b].length-counts[a].length);
    const words=text.trim().split(/\s+/).length;
    const raw=keys.reduce((s,k)=>s+Math.min(counts[k].length,4)*6+8,0);
    const score=Math.min(100,Math.round(raw*(words<40?1.2:1)));
    const lvl=score>=60?["High pressure","var(--bad)"]:score>=30?["Moderate pressure","var(--warn)"]:["Low pressure","var(--good)"];
    const hits=keys.map(k=>{const d=RADAR[k];const ex=[...new Set(counts[k].map(s=>s.toLowerCase()))].slice(0,4);
      return `<div class="hit"><div class="hit-head"><h3>${d.n}</h3><span class="pill c-${d.p}">${counts[k].length}×</span></div>
      <p class="small muted">Found: ${ex.map(x=>"“"+esc(x)+"”").join(", ")}</p><p class="small">${d.why}</p><p class="small"><b>Counter-move:</b> ${d.counter}</p></div>`}).join("");
    $("#radarOut").innerHTML = `<div class="scan-out">
      <div class="panel"><div class="row" style="justify-content:space-between"><h2>Marked message</h2>
        <div class="row small"><span class="pill c-influence">Persuasion</span><span class="pill c-desire">Desire & tribe</span><span class="pill c-biology">Threat</span><span class="pill c-reason">Certainty</span></div></div>
        <div class="marked">${html}</div></div>
      <div class="panel"><span class="eyebrow">Pressure index</span><div class="gauge"><b class="mono" style="color:${lvl[1]}">${score}</b><span style="color:${lvl[1]};font-weight:600">${lvl[0]}</span></div>
        <p class="small muted">${keys.length} of ${Object.keys(RADAR).length} lever types found. Pattern matching can't read intent, so a low score is not a clean bill of health. Use it to point your attention.</p>
        ${keys.length?hits:'<p>No common levers found. Still ask: who wrote this, what do they want from me, and what would change my mind?</p>'}
        <div class="row"><button class="btn" id="saveRadar">Save scan to journal</button></div></div></div>`;
    const sr=$("#saveRadar"); if(sr) sr.addEventListener("click",()=>saveEntry("radar",`Radar scan · ${score} (${lvl[0]})`,`Levers: ${keys.map(k=>RADAR[k].n+" ×"+counts[k].length).join(", ")||"none"}\n\n${text.slice(0,600)}${text.length>600?"…":""}`,"influence"));
  };
  $("#scan").addEventListener("click",run);
  $("#clearRadar").addEventListener("click",()=>{$("#radarIn").value="";store.set("radarDraft","");$("#radarOut").innerHTML="";$("#radarIn").focus();});
  run();
};

   ${now.length?`<p class="small muted">Fast levers: change the next hour</p><ul>${now.map(f=>`<li>${f.lv}</li>`).join("")}</ul>`:""}
   ${slow.length?`<p class="small muted">Slow levers: change the conditions</p><ul>${slow.map(f=>`<li>${f.lv}</li>`).join("")}</ul>`:""}
   <p class="small muted">Sapolsky: the more we understand, the harder simple blame gets. Accountability stays, but aim it at prevention.</p>
   <div class="row"><button class="btn primary" id="saveDec">Save to journal</button></div></div>`;
  $("#saveDec").addEventListener("click",()=>saveEntry("decoder",`Behavior decoded · ${on.length} factors`,`${st.what}\n\nFactors: ${on.map(f=>f.l).join("; ")}\n\nLevers:\n- ${on.map(f=>f.lv).join("\n- ")}`,"biology"));
 };
 $$("#main input, #main textarea, #main select").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",upd)); upd();
};

/* ---------- THINKING GYM ---------- */
let gym=null;
function newRound(filter){
  const pool=QUIZ.filter(q=>!filter||filter==="all"||q.p===filter);
  const s=gymStats();
  const scored=pool.map(q=>{const r=s[q.tag+"|"+q.p];const acc=r?r.c/r.n:0.4;return {q,w:(1-acc)+Math.random()*0.8};}).sort((a,b)=>b.w-a.w);
  gym={filter,qs:scored.slice(0,Math.min(5,pool.length)).map(x=>x.q),i:0,right:0,answered:false};
}
R.gym=()=>`<div class="view-head"><span class="eyebrow c-reason">Reason · Halpern, with all four lenses</span><h1>Thinking Gym</h1>
 <p class="lede">Five quick drills per round. Questions you miss come back more often. Every answer explains the reasoning, so a miss still teaches you something.</p></div>
 <div class="filters" id="gymFilters">${[["all","All lenses"],...Object.entries(PILLARS).map(([k,v])=>[k,v.name])].map(([k,n])=>`<button class="chip" data-gf="${k}" aria-pressed="${(gym?gym.filter:"all")===k}">${n}</button>`).join("")}</div>
 <div class="panel" id="gymBox"></div>`;
B.gym=()=>{
  if(!gym) newRound("all");
  $$("[data-gf]").forEach(b=>b.addEventListener("click",()=>{newRound(b.dataset.gf);route();}));
  drawQ();
};
function drawQ(){
  const box=$("#gymBox");
  const prog=`<div class="progress">${gym.qs.map((_,k)=>`<i class="${k<gym.i||(k===gym.i&&gym.answered)?"on":""}"></i>`).join("")}</div>`;
  if(gym.i>=gym.qs.length){
    const pct=Math.round(100*gym.right/gym.qs.length);
    box.innerHTML=`${prog}<span class="eyebrow">Round complete</span><div class="gauge"><b class="mono">${gym.right}/${gym.qs.length}</b><span class="muted">${pct}%</span></div>
      <p>${pct===100?"Clean round. Your shortcuts held up today.":pct>=60?"Solid. The misses mark where you are easiest to move.":"Good training. These misses are exactly the shortcuts persuaders rely on."}</p>
      <div class="row"><button class="btn primary" id="again">New round</button><a class="btn" href="#codex" style="text-decoration:none">Study the Codex</a></div>`;
    $("#again").addEventListener("click",()=>{newRound(gym.filter);drawQ();});
    markProtocol("gym"); return;
  }
  const q=gym.qs[gym.i];
  box.innerHTML=`${prog}<div class="row"><span class="pill c-${q.p}">${PILLARS[q.p].name}</span><span class="pill" style="color:var(--muted)">${esc(q.tag)}</span><span class="mono small muted" style="margin-left:auto">${gym.i+1} / ${gym.qs.length}</span></div>
   <h2 style="font-size:1.15rem;font-family:var(--body);font-weight:600;line-height:1.45">${esc(q.q)}</h2>
   <div class="q-opts">${q.o.map((o,k)=>`<button class="q-opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="qExp"></div>`;
  $$(".q-opt").forEach(b=>b.addEventListener("click",()=>{
    if(gym.answered) return; gym.answered=true;
    const k=+b.dataset.k, ok=k===q.a; if(ok) gym.right++;
    const s=gymStats(), key=q.tag+"|"+q.p; s[key]=s[key]||{c:0,n:0}; s[key].n++; if(ok) s[key].c++; store.set("gym",s);
    $$(".q-opt").forEach((x,j)=>{x.disabled=true; if(j===q.a) x.classList.add("right"); else if(j===k) x.classList.add("wrong");});
    $("#qExp").innerHTML=`<div class="explain"><p><b>${ok?"Correct.":"Not quite."}</b> ${esc(q.e)}</p></div><div class="row" style="margin-top:12px"><button class="btn primary" id="nextQ">${gym.i+1<gym.qs.length?"Next question":"See results"}</button></div>`;
    $("#nextQ").addEventListener("click",()=>{gym.i++;gym.answered=false;drawQ();}); $("#nextQ").focus();
  }));
}

/* ---------- DECISION LAB ---------- */
const DEFAULT_DEC={q:"Should I take the job offer in another city?",opts:["Take the new job","Stay and negotiate a raise"],
 cons:[{n:"Long-term growth",w:9,r:[8,5]},{n:"Money",w:6,r:[7,6]},{n:"Close relationships",w:8,r:[4,8]},{n:"Daily stress",w:5,r:[5,6]}],
 checks:{},pre:""};
const MINDCHECKS=[
 {id:"halt",l:"I'm hungry, angry, lonely, or tired right now",s:"biology",t:"Your frontal cortex is running low. Re-score after rest."},
 {id:"rush",l:"Someone else set the deadline, or I feel rushed",s:"influence",t:"Imposed scarcity. Ask for more time. Real offers usually survive it."},
 {id:"gift",l:"I feel I owe someone involved",s:"influence",t:"Reciprocity pressure. Separate repaying a favor from making this choice."},
 {id:"model",l:"I'm drawn to an option because someone I compare myself with chose it",s:"desire",t:"Mimetic pull. Re-score as if that person never existed."},
 {id:"sunk",l:"I've already invested a lot in one option",s:"reason",t:"Sunk cost. Score only future costs and benefits."},
 {id:"public",l:"I already told people what I'd choose",s:"influence",t:"Consistency pressure. Changing your mind on new evidence is a skill."},
 {id:"fear",l:"One option mainly avoids a scary loss",s:"reason",t:"Loss framing. Restate each option as a gain and see if the ranking holds."}
];
R.decide=()=>`<div class="view-head"><span class="eyebrow">All four lenses · Halpern's decision worksheet</span><h1>Decision Lab</h1>
 <p class="lede">Weigh what matters, score each option, then check your state of mind. The numbers don't decide for you. They show where your gut and your priorities disagree.</p></div>
 <div class="panel" id="decBox"></div><div class="grid2"><div class="panel" id="mindBox"></div><div class="panel" id="verdict"></div></div>`;
B.decide=()=>{
  let d=store.get("decision",DEFAULT_DEC);
  const save=()=>store.set("decision",d);
  const totals=()=>d.opts.map((_,j)=>d.cons.reduce((s,c)=>s+(+c.w||0)*(+c.r[j]||0),0));
  const drawVerdict=()=>{
    const t=totals(), max=Math.max(...t), best=t.indexOf(max), sorted=[...t].sort((a,b)=>b-a), gap=sorted.length>1?sorted[0]-sorted[1]:max;
    const total=d.cons.reduce((s,c)=>s+(+c.w||0)*10,0)||1;
    const flags=MINDCHECKS.filter(m=>d.checks[m.id]);
    $$("tfoot td[data-tot]").forEach((td,j)=>{td.textContent=t[j];td.className=j===best?"win":"";});
    $("#verdict").innerHTML=`<h2>Readout</h2>
      <p>On your own weights, <b>${esc(d.opts[best]||"—")}</b> leads by <span class="mono">${gap}</span> points (${Math.round(100*gap/total)}% of the possible range).</p>
      <p class="small">${gap/total<0.05?"That is close to a tie. The deciding factor is probably something you haven't listed yet. Add it.":"That is a clear margin. If your gut still disagrees, the gut may be tracking something real, or something someone planted. Find out which."}</p>
      ${flags.length?`<div class="result"><b>${flags.length} mind-check flag${flags.length>1?"s":""}</b><ul>${flags.map(f=>`<li>${f.t}</li>`).join("")}</ul></div>`:`<p class="small muted">No mind-check flags ticked.</p>`}
      <label class="field" for="pre">Pre-mortem: it's a year from now and this choice failed. What went wrong? <textarea id="pre" style="min-height:80px">${esc(d.pre)}</textarea></label>
      <p class="small muted">10/10/10: how will you feel about it in 10 minutes, 10 months, and 10 years?</p>
      <div class="row"><button class="btn primary" id="saveDecision">Save decision to journal</button><button class="btn ghost" id="resetDecision">Start new decision</button></div>`;
    $("#pre").addEventListener("input",e=>{d.pre=e.target.value;save();});
    $("#saveDecision").addEventListener("click",()=>{const t2=totals();saveEntry("decide",`Decision · ${d.q}`,`${d.opts.map((o,j)=>`${o}: ${t2[j]}`).join("\n")}\n\nConsiderations: ${d.cons.map(c=>`${c.n} (w${c.w})`).join(", ")}\nFlags: ${flags.map(f=>f.l).join("; ")||"none"}\nPre-mortem: ${d.pre||"—"}`,"reason");});
    $("#resetDecision").addEventListener("click",()=>{d={q:"",opts:["Option A","Option B"],cons:[{n:"",w:5,r:[5,5]}],checks:{},pre:""};save();drawAll();});
  };
  const drawAll=()=>{
    $("#decBox").innerHTML=`<label class="field" for="dq">The decision<input type="text" id="dq" value="${esc(d.q)}" placeholder="What are you deciding?"></label>
     <div class="tbl-wrap"><table><thead><tr><th>Consideration</th><th>Weight 1–10</th>${d.opts.map((o,j)=>`<th><input type="text" data-opt="${j}" value="${esc(o)}" aria-label="Option ${j+1} name"></th>`).join("")}<th></th></tr></thead>
     <tbody>${d.cons.map((c,i)=>`<tr><td><input type="text" data-cn="${i}" value="${esc(c.n)}" placeholder="What matters?" aria-label="Consideration ${i+1}"></td><td><input type="number" min="0" max="10" data-cw="${i}" value="${c.w}" aria-label="Weight"></td>
       ${d.opts.map((_,j)=>`<td><input type="number" min="0" max="10" data-cr="${i}:${j}" value="${c.r[j]??5}" aria-label="Score"></td>`).join("")}<td><button class="btn sm ghost" data-del="${i}" aria-label="Remove row">✕</button></td></tr>`).join("")}</tbody>
     <tfoot><tr><td>Weighted total</td><td></td>${d.opts.map((_,j)=>`<td data-tot="${j}"></td>`).join("")}<td></td></tr></tfoot></table></div>
     <div class="row"><button class="btn" id="addCon">Add consideration</button>${d.opts.length<4?`<button class="btn" id="addOpt">Add option</button>`:""}${d.opts.length>2?`<button class="btn ghost" id="delOpt">Remove last option</button>`:""}</div>`;
    $("#mindBox").innerHTML=`<h2>Mind check</h2><p class="small muted">Tick anything true right now. Each one is a known way people get moved.</p>
      <div class="stack">${MINDCHECKS.map(m=>`<label class="check"><input type="checkbox" data-mc="${m.id}" ${d.checks[m.id]?"checked":""}><span>${m.l} <span class="pill c-${m.s}" style="margin-left:4px">${PILLARS[m.s].name}</span></span></label>`).join("")}</div>`;
    $("#dq").addEventListener("input",e=>{d.q=e.target.value;save();});
    $$("[data-opt]").forEach(el=>el.addEventListener("input",()=>{d.opts[+el.dataset.opt]=el.value;save();drawVerdict();}));
    $$("[data-cn]").forEach(el=>el.addEventListener("input",()=>{d.cons[+el.dataset.cn].n=el.value;save();}));
    $$("[data-cw]").forEach(el=>el.addEventListener("input",()=>{d.cons[+el.dataset.cw].w=Math.max(0,Math.min(10,+el.value||0));save();drawVerdict();}));
    $$("[data-cr]").forEach(el=>el.addEventListener("input",()=>{const [i,j]=el.dataset.cr.split(":").map(Number);d.cons[i].r[j]=Math.max(0,Math.min(10,+el.value||0));save();drawVerdict();}));
    $$("[data-del]").forEach(el=>el.addEventListener("click",()=>{d.cons.splice(+el.dataset.del,1);if(!d.cons.length)d.cons.push({n:"",w:5,r:d.opts.map(()=>5)});save();drawAll();}));
    $("#addCon").addEventListener("click",()=>{d.cons.push({n:"",w:5,r:d.opts.map(()=>5)});save();drawAll();});
    const ao=$("#addOpt"); if(ao) ao.addEventListener("click",()=>{d.opts.push("Option "+String.fromCharCode(65+d.opts.length));d.cons.forEach(c=>c.r.push(5));save();drawAll();});
    const dl=$("#delOpt"); if(dl) dl.addEventListener("click",()=>{d.opts.pop();d.cons.forEach(c=>c.r.pop());save();drawAll();});
    $$("[data-mc]").forEach(el=>el.addEventListener("change",()=>{d.checks[el.dataset.mc]=el.checked;save();drawVerdict();}));
    drawVerdict();
  };
  drawAll();
};

/* ---------- CODEX ---------- */
let codexFilter="all", codexQuery="";
R.codex=()=>`<div class="view-head"><span class="eyebrow">Library</span><h1>Codex</h1>
 <p class="lede">${CODEX.length} core ideas from the four books, each paired with one way to use it this week.</p></div>
 <div class="row"><div class="filters">${[["all","All"],...Object.entries(PILLARS).map(([k,v])=>[k,v.name])].map(([k,n])=>`<button class="chip" data-cf="${k}" aria-pressed="${codexFilter===k}">${n}</button>`).join("")}</div>
 <input type="text" id="cq" placeholder="Search ideas" value="${esc(codexQuery)}" style="max-width:260px;margin-left:auto" aria-label="Search the Codex"></div>
 <div class="row small muted">${Object.entries(PILLARS).map(([k,v])=>`<span><span class="c-${k}">●</span> ${esc(v.book)}</span>`).join(" ")}</div>
 <div class="cards" id="cards"></div>`;
B.codex=()=>{
 const draw=()=>{const q=codexQuery.toLowerCase();
  const list=CODEX.filter(c=>(codexFilter==="all"||c.p===codexFilter)&&(!q||(c.t+c.d+c.u).toLowerCase().includes(q)));
  $("#cards").innerHTML=list.length?list.map(c=>`<article class="card"><div class="row" style="justify-content:space-between"><span class="pill c-${c.p}">${PILLARS[c.p].name}</span><span class="src">${esc(c.s)}</span></div>
   <h3>${esc(c.t)}</h3><p class="small">${esc(c.d)}</p><div class="use"><b>Use it</b>${esc(c.u)}</div></article>`).join(""):`<div class="empty">No ideas match “${esc(codexQuery)}”.</div>`;};
 $$("[data-cf]").forEach(b=>b.addEventListener("click",()=>{codexFilter=b.dataset.cf;$$("[data-cf]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();}));
 $("#cq").addEventListener("input",e=>{codexQuery=e.target.value;draw();});
 draw();
};

R.future=()=>`<div class="view-head"><span class="eyebrow">Library</span><h1>Future Field Guide</h1>
 <p class="lede">Nobody can see the future, but some pressures are already building. These are seven forces likely to shape the coming decades, each linked to the lens that helps and a practice you can start now.</p></div>
 <div class="future">${FUTURE.map(f=>`<section class="f-item"><div class="stack"><div class="row">${f.p.map(p=>`<span class="pill c-${p}">${PILLARS[p].name}</span>`).join("")}</div><h2>${esc(f.t)}</h2><p>${esc(f.pr)}</p></div>

/* ---------- JOURNAL ---------- */
R.journal=()=>{
 const j=journal();
 return `<div class="view-head"><span class="eyebrow">Library</span><h1>Journal</h1>
 <p class="lede">Everything you save from the tools. Re-reading old entries is how you catch your own patterns, and how you correct hindsight bias.</p></div>
 <div class="panel"><label class="field" for="jNew">New entry<textarea id="jNew" style="min-height:80px" placeholder="A pattern you noticed, a prediction to check later, a lesson."></textarea></label>
 <div class="row"><button class="btn primary" id="jAdd">Add entry</button><button class="btn" id="jExport">Copy backup</button><button class="btn ghost" id="jImportToggle">Restore from backup</button></div>
 <div id="jImport" hidden class="stack"><label class="field" for="jImportText">Paste a backup you copied earlier<textarea id="jImportText"></textarea></label><div class="row"><button class="btn" id="jImportGo">Restore entries</button></div></div></div>
 ${j.length?j.map(e=>`<article class="entry"><div class="row" style="justify-content:space-between"><div class="row"><span class="pill c-${e.pillar||"reason"}">${esc(e.tool)}</span><b>${esc(e.title)}</b></div>
  <div class="row"><span class="mono small muted">${new Date(e.date).toLocaleString()}</span><button class="btn sm ghost" data-jdel="${e.id}">Delete</button></div></div><pre>${esc(e.body)}</pre></article>`).join(""):`<div class="empty">No entries yet. Save a scan, audit, decode, or decision and it will show up here.</div>`}`;
};
B.journal=()=>{
 $("#jAdd").addEventListener("click",()=>{const v=$("#jNew").value.trim();if(!v){toast("Write something first");return;}saveEntry("journal","Note",v,"reason");route();});
 $$("[data-jdel]").forEach(b=>b.addEventListener("click",()=>{
   if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Confirm delete";return;}
   store.set("journal",journal().filter(e=>String(e.id)!==b.dataset.jdel));route();toast("Entry deleted");}));
 $("#jExport").addEventListener("click",()=>{const data=JSON.stringify({journal:journal(),gym:gymStats()});
   navigator.clipboard?.writeText(data).then(()=>toast("Backup copied. Paste it somewhere safe."),()=>{$("#jImport").hidden=false;$("#jImportText").value=data;$("#jImportText").select();toast("Select and copy the text shown");}) ?? (()=>{$("#jImport").hidden=false;$("#jImportText").value=data;$("#jImportText").select();})();});
 $("#jImportToggle").addEventListener("click",()=>{$("#jImport").hidden=!$("#jImport").hidden;});
 $("#jImportGo").addEventListener("click",()=>{try{const o=JSON.parse($("#jImportText").value);
   if(!Array.isArray(o.journal)) throw 0; const ids=new Set(journal().map(e=>e.id));
   store.set("journal",[...journal(),...o.journal.filter(e=>e&&e.id&&!ids.has(e.id))].sort((a,b)=>b.id-a.id));
   if(o.gym&&typeof o.gym==="object") store.set("gym",{...o.gym,...gymStats()});
   route();toast("Backup restored");}catch(e){toast("That text isn't a Mastermind backup. Copy the full backup and try again.");}});
};

<script>
"use strict";
// ---------- Formats and length maths ----------
const WORDS_PER_PROSE_PAGE = 250;
const WORDS_PER_SCRIPT_PAGE = 180; // one screenplay/play page ≈ one minute
const FORMATS = [
  { key: "short-story", group: "page", name: "Short story", words: 4000 },
  { key: "long-story", group: "page", name: "Long story / novella", words: 20000 },
  { key: "novel", group: "page", name: "Novel", words: 70000 },
  { key: "one-act", group: "stage", name: "One-act play", minutes: 30 },
  { key: "full-play", group: "stage", name: "Full-length play", minutes: 90 },
  { key: "reel", group: "screen", name: "Reel / Short", seconds: 30 },
  { key: "yt-short", group: "screen", name: "YouTube short", seconds: 60 },
  { key: "short-film", group: "screen", name: "Short film", minutes: 10 },
  { key: "feature", group: "screen", name: "Feature film", minutes: 110 },
  { key: "web-series", group: "screen", name: "Web series", episodes: 6, epMinutes: 20 },
];
const GROUPS = { page: "On the page", stage: "On stage", screen: "On screen" };
const SCREEN_CATS = ["Reel / Short", "YouTube short", "Short film", "Feature film", "Web series", "Stage"];
const fmtOf = s => FORMATS.find(f => f.key === s.formatKey);
const medium = s => fmtOf(s)?.group || "page";
const effLang = s => medium(s) === "page" ? s.lang : "hinglish";
const isShortForm = s => !!fmtOf(s)?.seconds;
const fmtSeconds = sec => sec >= 60 && sec % 60 === 0 ? `${sec / 60} min` : `${sec} sec`;

function presetLength(f) {
  if (f.seconds) return { seconds: f.seconds, minutes: f.seconds / 60, pages: 1 };
  if (f.group === "page") return { words: f.words, pages: Math.round(f.words / WORDS_PER_PROSE_PAGE), minutes: Math.round(f.words / WORDS_PER_PROSE_PAGE) };
  if (f.key === "web-series") return { episodes: f.episodes, epMinutes: f.epMinutes, minutes: f.episodes * f.epMinutes, pages: f.episodes * f.epMinutes };
  return { minutes: f.minutes, pages: Math.max(1, f.minutes) };
}
function suggestCat(s) {
  const f = fmtOf(s); if (!f) return "Short film";
  if (f.group === "stage") return "Stage";
  if (f.key === "reel") return "Reel / Short";
  if (f.key === "yt-short") return "YouTube short";
  if (f.key === "short-film") return "Short film";
  if (f.key === "feature") return "Feature film";
  if (f.key === "web-series") return "Web series";
  const m = s.len.minutes || 0;
  return m <= 40 ? "Short film" : m <= 180 ? "Feature film" : "Web series";
}
function fmtMinutes(m) {
  if (m < 1.5) return "60 sec";
  if (m < 90) return Math.round(m) + " min";
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return h + " h" + (r ? " " + r + " min" : "");
}
function presetMeta(f) {
  const l = presetLength(f);
  if (f.seconds) return `${fmtSeconds(f.seconds)} · vertical 9:16 · hook first`;
  if (f.group === "page") return `${l.words.toLocaleString("en-IN")} words · ≈ ${l.pages} pages`;
  if (f.key === "web-series") return `${l.episodes} × ${l.epMinutes} min · ≈ ${l.pages} pages`;
  return `${fmtMinutes(l.minutes)} · ≈ ${l.pages} ${l.pages === 1 ? "page" : "pages"}`;
}
function totalWords(s) {
  if (isShortForm(s)) return Math.max(15, Math.round((s.len.seconds || fmtOf(s).seconds) * 2.5)); // spoken words, ~150 per minute
  return medium(s) === "page" ? (s.len.words || 0) : Math.round((s.len.pages || 1) * WORDS_PER_SCRIPT_PAGE);
}
function partCount(s) {
  const f = fmtOf(s);
  if (f?.seconds) return 1;
  let n = Math.max(1, Math.min(40, Math.round(totalWords(s) / 2200)));
  if (f?.key === "web-series") {
    const eps = Math.max(1, s.len.episodes || 1);
    const per = Math.max(1, Math.round(n / eps));
    n = Math.min(40, Math.max(eps, per * eps));
  }
  return n;
}
function lenLabel(s) {
  const m = medium(s), l = s.len;
  if (isShortForm(s)) return `${fmtSeconds(l.seconds || fmtOf(s).seconds)} vertical video (9:16), about ${totalWords(s)} spoken words`;
  if (m === "page") return `${(l.words || 0).toLocaleString("en-IN")} words (≈ ${l.pages} pages); about ${fmtMinutes(l.minutes || 1)} if adapted for the screen`;
  if (fmtOf(s)?.key === "web-series") return `${l.episodes} episodes × ${l.epMinutes} min (≈ ${l.pages} script pages in total)`;
  return `${fmtMinutes(l.minutes || 1)} running time (≈ ${l.pages} script ${l.pages === 1 ? "page" : "pages"})`;
}

// ---------- Storage: private per-person rows in the artifact db, browser storage as fallback ----------
const Store = {
  db: null, uid: null, mode: "local",
  async init() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      const uid = user ? await user.id() : null;
      if (db && uid) { this.db = db; this.uid = uid; this.mode = "db"; }
    } catch (e) { /* stay local */ }
  },
  col() { return this.db.collection("data/users/" + this.uid); },
  localGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  localSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  async list() {
    if (this.mode === "db") {
      const snap = await this.col().orderBy("updatedAt", "desc").limit(200).get();
      return snap.docs.map(d => d.data()).filter(x => x && x.idea !== undefined && !String(x.id).startsWith("_"));
    }
    return Object.values(this.localGet("pd.stories", {})).sort((a, b) => b.updatedAt - a.updatedAt);
  },
  async save(s, keepTime) {
    if (!keepTime) s.updatedAt = Date.now();
    const data = JSON.parse(JSON.stringify(s));
    if (this.mode === "db") return this.col().doc(s.id).set(data);
    const all = this.localGet("pd.stories", {}); all[s.id] = data; this.localSet("pd.stories", all);
  },
  async remove(id) {
    if (this.mode === "db") {
      const parts = await this.col().doc(id).collection("parts").get();
      for (const d of parts.docs) await this.col().doc(id).collection("parts").doc(d.id).delete();
      return this.col().doc(id).delete();
    }
    const all = this.localGet("pd.stories", {}); delete all[id]; this.localSet("pd.stories", all);
    this.localSet("pd.parts." + id, null);
  },
  async parts(id) {
    if (this.mode === "db") {
      const snap = await this.col().doc(id).collection("parts").get();
      const out = {}; snap.docs.forEach(d => { const v = d.data(); out[v.i] = v; }); return out;
    }
    return this.localGet("pd.parts." + id, {}) || {};
  },
  async savePart(id, p) {
    if (this.mode === "db") await this.col().doc(id).collection("parts").doc("p" + p.i).set(p);
    else { const all = this.localGet("pd.parts." + id, {}) || {}; all[p.i] = p; this.localSet("pd.parts." + id, all); }
    partsChanged(id);
  },
};

// ---------- Claude ----------
const AI = {
  sample: null, tiers: ["default", "complex", "quick"], ready: false,
  async init() {
    try {
      if (!window.claude?.use) return;
      this.sample = await claude.use("sample");
      if (this.sample) {
        const lim = await this.sample.limits().catch(() => null);
        if (lim?.modelTiers) this.tiers = lim.modelTiers;
      }
    } catch (e) { this.sample = null; }
    this.ready = true;
  },
  tier(t) { return this.tiers.includes(t) ? t : undefined; },
  errText(e) {
    const c = e?.code;
    if (c === "not_granted") return "This page isn't allowed to use Claude. Open the page's permissions and allow Claude, then try again.";
    if (c === "rate_limited") return "You've reached your Claude usage limit for now. Wait a while, then try again.";
    if (c === "cancelled") return "Stopped.";
    if (c === "invalid_json") return "Claude's reply came back in the wrong shape. Press the button again.";
    return "Claude couldn't answer: " + (e?.message || "unknown error") + ". Try again.";
  },
};
const langRule = s => effLang(s) === "hindi"
  ? "Hindi in Devanagari script. Natural, modern spoken Hindi; keep English words only where Hindi speakers naturally would."
  : "Hinglish: Hindi written in Roman (Latin) letters, mixed naturally with English the way Indian film and web-series scripts are written. Never use Devanagari.";
const langName = s => effLang(s) === "hindi" ? "Hindi (Devanagari)" : "Hinglish (Roman script)";

function bible(s, withOutline) {
  const f = fmtOf(s);
  let t = `STORY IDEA:\n${s.idea}\n\nWorking title: ${s.title || "(none yet)"}\nForm: ${f.name} (${GROUPS[f.group].toLowerCase()})\nLength: ${lenLabel(s)}\nScreen category: ${s.screenCat}\nLanguage of all writing: ${langRule(s)}\n` + (s.imageNote ? `Inspiration image (the story began from a photo; described): ${s.imageNote}\n` : "");
  const qa = s.qa.filter(x => x.a);
  if (qa.length) t += `\nTHE WRITER'S ANSWERS TO DEVELOPMENT QUESTIONS:\n` + qa.map(x => `Q: ${x.q}\nA: ${x.a}`).join("\n") + "\n";
  if (withOutline && s.outline) {
    const o = s.outline;
    t += `\nTITLE: ${o.title}\nLOGLINE: ${o.logline}\nCHARACTERS:\n` + o.characters.map(c => `- ${c.name}: ${c.role}`).join("\n") + "\n";
  }
  return t;
}
function formatRules(s) {
  const f = fmtOf(s);
  if (f.seconds) {
    const sec = story.len.seconds || f.seconds;
    return `Write a ${sec}-second vertical (9:16) short-video script for Instagram Reels and YouTube Shorts:
- First line: a scene heading starting INT. or EXT., location in Hinglish.
- Then sections, each starting with a centred marker line exactly like "> HOOK (0–3 SEC) <", then "> BEAT 1 (3–10 SEC) <" and so on, ending with "> PAYOFF (LAST 5 SEC) <". Give real timecodes that add up to ${sec} seconds; use 2–4 beats.
- The hook must stop the scroll in the first 3 seconds: a surprising image, question or line. No slow build-up, no introductions.
- Under each marker: one short action line for what we see, a line starting "ON-SCREEN TEXT:" when text should appear, and any spoken words as a character name in CAPITALS (add (V.O.) for voice-over) with the line below it.
- The payoff lands the twist or punchline and ends on a strong last line or a loop back to the hook.
- About ${totalWords(story)} spoken words in total. All text in Hinglish.`;
  }
  if (f.group === "screen") {
    let r = `Write in screenplay format using Fountain syntax:
- Scene headings on their own line, starting INT. or EXT., then the location in Hinglish, then " - DAY" / " - NIGHT", e.g. "INT. SHARMA JI KA GHAR - NIGHT".
- Action lines in present tense, short and visual, in Hinglish.
- Character name in CAPITALS on its own line, the dialogue on the lines right below it; a parenthetical like (dheere se) on its own line between name and dialogue when needed.
- Transitions like "CUT TO:" in capitals on their own line, sparingly.
- Leave one blank line between elements.`;
    if (f.key === "web-series") r += `\n- When a part starts a new episode, begin it with a centred line like "> EPISODE 2: TITLE <".`;
    return r;
  }
  if (f.group === "stage") return `Write in stage-play format:
- Act and scene headings in capitals on their own line, e.g. "ANK 1 — DRISHYA 2" or "ACT ONE, SCENE TWO".
- Stage directions on their own line inside round brackets, e.g. (Lights come up on a crowded railway platform.)
- Character name in CAPITALS on its own line, the dialogue on the lines right below it.
- Leave one blank line between elements. All text in Hinglish.`;
  return `Write as prose fiction: vivid scenes, dialogue in quotation marks, paragraphs separated by a blank line. Start the part with its heading on the first line, prefixed with "# ".`;
}

// ---------- App state ----------
const app = document.getElementById("app");
let stories = [], story = null, parts = {}, view = "home", curPart = 0, loading = true;
let busy = null; // {label, ctrl}

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}

async function askQuestions(more) {
  if (!AI.sample) return;
  const ctrl = new AbortController(); busy = { label: "Reading your idea and thinking of questions…", ctrl }; msg = null; render();

  const prompt = `You are a story development editor preparing a writer for a first draft.\n\n${bible(story)}${prev}\n\nAsk the ${count} questions whose answers would most improve the first draft of THIS story: only what the idea leaves unclear (the protagonist's want and wound, the central conflict, the ending, tone, world, point of view, key relationships). Each question is one short, concrete sentence written in ${langName(story)}, the way a friendly film writer would ask it.\n\nReply with JSON only: {"questions": ["...", "..."]}`;
  try {
    const r = await AI.sample.json(prompt, { signal: ctrl.signal, modelTier: AI.tier("default") });
    const qs = (r?.questions || []).filter(q => typeof q === "string" && q.trim()).slice(0, 6);
    story.qa.push(...qs.map(q => ({ q: q.trim(), a: "" })));
    if (!qs.length) msg = { text: "Claude didn't come back with any questions. Press “Ask me more” to try again, or go straight to the outline.", err: true };
    persist();
  } catch (e) { msg = { text: AI.errText(e), err: e?.code !== "cancelled" }; }

}

async function makeOutline(change) {
  if (!AI.sample) return;
  const ctrl = new AbortController(); busy = { label: change ? "Revising the outline…" : "Building the outline…", ctrl }; msg = null; render();
  const n = partCount(story), f = fmtOf(story);
  const hint = f.key === "web-series" ? ` The series has ${story.len.episodes} episodes; split them evenly and name each part with its episode, e.g. "Episode 1 · Part 1: ..."`
    : f.key === "novel" || f.key === "long-story" ? " Each part is a chapter."
    : f.group === "stage" ? " Each part follows the play's acts and scenes in order."
    : f.group === "screen" ? " Each part is a sequence of consecutive scenes." : "";
  let prompt = `You are an experienced story editor for Indian film, theatre and fiction.\n\n${bible(story)}\n`;
  if (change && story.outline) prompt += `\nCURRENT OUTLINE (JSON):\n${JSON.stringify(story.outline)}\n\nRevise this outline with these changes from the writer:\n${change}\nKeep everything else that still works.\n`;
  else prompt += `\nBuild the outline for the first draft.\n`;
  prompt += `\nPlan exactly ${n} ${n === 1 ? "part" : "parts"} in story order.${hint} Each part summary is 2–4 sentences of what actually happens. Give the main characters (3–8) with a one-line description each. Then give exactly 3 concrete suggestions that would make this story stronger — changes to plot, character, structure, ending or format — each one or two sentences, specific to this story.\n\nWrite every text value in ${langName(story)}.\n\nReply with JSON only, in this shape:\n{"title": string, "logline": string, "characters": [{"name": string, "role": string}], "parts": [{"title": string, "summary": string}], "suggestions": [string]}`;
  try {
    const o = await AI.sample.json(prompt, { signal: ctrl.signal, modelTier: AI.tier("complex"), cache: false });
    if (!o || !Array.isArray(o.parts) || !o.parts.length) throw { code: "invalid_json" };
    story.outline = {
      title: String(o.title || story.title || "Untitled"), logline: String(o.logline || ""),
      characters: (o.characters || []).map(c => ({ name: String(c.name || ""), role: String(c.role || "") })),
      parts: o.parts.map(p => ({ title: String(p.title || ""), summary: String(p.summary || "") })),
      suggestions: (o.suggestions || []).map(String).slice(0, 5),
    };
    if (change) { parts = {}; }
    persist();
  } catch (e) { msg = { text: AI.errText(e), err: e?.code !== "cancelled" }; }
  busy = null; render();
}

// ---------- Draft ----------
function firstUnwritten() {
  const n = story?.outline?.parts.length || 0;
  for (let i = 0; i < n; i++) if (!parts[i]?.text) return i;
  return Math.max(0, n - 1);
}
async function writePart(i, mode, note) {
  if (!AI.sample) return;
  const o = story.outline, n = o.parts.length;
  const ctrl = new AbortController();
  if (pendingNotes[i - 1]) {
    busy = { label: "Updating the story-so-far notes…", ctrl }; curPart = i; render();

// Stream Claude into an element, rendering Markdown as it arrives.
async function streamInto(el, prompt, opts = {}) {
  let raf = 0, latest = "";
  const r = await AI.sample(prompt, { cache: false, modelTier: AI.tier(opts.tier || "default"), signal: opts.signal,
    onText: ({ text }) => { latest = text; if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (el) el.replaceChildren(md(opts.clean ? opts.clean(latest) : latest)); }); } });
  return r.text;
}

const STOP = new Set("the and that with this from have for was were are but not you your they them their his her she him its what when which into there then than been will would could should about also just like one all can had has our out who how hai hain aur nahi kya kar raha rahi tha thi the ki ka ke ko se mein par bhi woh yeh koi kuch".split(" "));
const tok = s => ((s || "").toLowerCase().match(/[\p{L}\p{M}\p{N}]{3,}/gu) || []).filter(w => !STOP.has(w));
function windows(text, label, size = 1800) {
  const out = [];
  for (let i = 0; i < text.length; i += size) out.push({ label, text: text.slice(i, i + size + 200) });
  return out;
}
async function piecesFor(id) {
  if (Lib.pieceCache[id]) return Lib.pieceCache[id];
  let ps = [];
  if (id.startsWith("book:")) {
    const b = Lib.books.find(x => "book:" + x.id === id); if (!b) return [];
    for (const c of await Lib.chunks(b.id)) for (const p of c.pages) if (p.t) ps.push(...windows(p.t, `${b.title}, p. ${p.p}`));
  } else {
    const v = Lib.videos.find(x => "video:" + x.id === id); if (!v?.transcript) return [];
    ps = windows(v.transcript, `Video: ${v.title}${v.person ? " (" + v.person + ")" : ""}`);
  }
  ps.forEach(p => { const tf = new Map(); for (const w of tok(p.text)) tf.set(w, (tf.get(w) || 0) + 1); p.tf = tf; p.len = [...tf.values()].reduce((a, b) => a + b, 0) || 1; });
  return (Lib.pieceCache[id] = ps);
}
async function libraryPassages(query, k = 4, ids) {
  const all = ids || [...Lib.books.map(b => "book:" + b.id), ...Lib.videos.filter(v => v.transcript).map(v => "video:" + v.id)];
  let pieces = [];
  for (const id of all) { try { pieces = pieces.concat(await piecesFor(id)); } catch {} }
  if (!pieces.length) return [];
  const q = [...new Set(tok(query))].slice(0, 300);
  const df = new Map(); for (const w of q) { let n = 0; for (const p of pieces) if (p.tf.has(w)) n++; df.set(w, n); }
  const N = pieces.length;
  const scored = pieces.map(p => { let s = 0; for (const w of q) { const f = p.tf.get(w); if (f) s += (f / (f + 1.2 * (0.25 + 0.75 * p.len / 300))) * Math.log(1 + N / (df.get(w) || 1)); } return { p, s }; })
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, k);
  return scored.map(x => ({ label: x.p.label, text: x.p.text }));
}
const libraryIds = () => [...Lib.books.map(b => "book:" + b.id), ...Lib.videos.filter(v => v.transcript).map(v => "video:" + v.id)];

function textStats(t) {
  const words = (t.match(/\S+/g) || []).length;
  const sentences = Math.max(1, (t.match(/[^.!?।]+[.!?।]+/g) || []).length || 1);
  const paras = t.split(/\n\s*\n/).filter(x => x.trim()).length;
  const quoted = (t.match(/["“][^"”]*["”]/g) || []).join("").length;
  const lines = t.split("\n"); let dlg = 0;
  for (let i = 1; i < lines.length; i++) if (isUpper(lines[i - 1].trim().replace(/\(.*?\)/g, "")) && lines[i - 1].trim().length < 50 && lines[i].trim() && !isUpper(lines[i].trim())) dlg += lines[i].length;
  return { words, sentences, avg: Math.round(words / sentences * 10) / 10, paras, dialogue: Math.round(100 * Math.min(1, (quoted + dlg) / Math.max(1, t.length))) };
}
function wordDiff(a, b) {
  const A = a.match(/\S+\s*/g) || [], B = b.match(/\S+\s*/g) || [];
  const n = A.length, m = B.length;
  if (n * m > 12e6) return null;
  const key = s => s.trim();
  const dp = new Uint32Array((n + 1) * (m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i * (m + 1) + j] = key(A[i]) === key(B[j]) ? dp[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(dp[(i + 1) * (m + 1) + j], dp[i * (m + 1) + j + 1]);
  const out = []; let i = 0, j = 0;
  const push = (t, s) => { const last = out[out.length - 1]; if (last && last.t === t) last.s += s; else out.push({ t, s }); };
  while (i < n && j < m) {
    if (key(A[i]) === key(B[j])) { push("same", B[j]); i++; j++; }
    else if (dp[(i + 1) * (m + 1) + j] >= dp[i * (m + 1) + j + 1]) { push("del", A[i]); i++; }
    else { push("ins", B[j]); j++; }
  }
  while (i < n) push("del", A[i++]); while (j < m) push("ins", B[j++]);
  return out;
}

// ---------- Weekly digest (read by the "Sangam Sunday" scheduled task) ----------
let digestLast = "", digestTimer = 0;
function buildDigest() {
  const tot = dailyTotals(), g = Goal.words, days = [];
  for (let i = 6; i >= 0; i--) { const k = dayKey(new Date(Date.now() - i * 864e5)); days.push({ k, v: tot[k] || 0 }); }
  let run = 0, longest = 0; for (const d of days) { run = d.v >= g ? run + 1 : 0; longest = Math.max(longest, run); }
  const weekAgo = Date.now() - 7 * 864e5;
  const sprints = SprintLog.items.filter(e => e.at >= weekAgo);
  const pool = sprints.length ? sprints : SprintLog.items;
  const tb = BUCKETS.map(([name, range, test]) => { const xs = pool.filter(e => test(new Date(e.at).getHours())); const w = xs.reduce((a, e) => a + (e.words || 0), 0); return { name, range, sprints: xs.length, avg: xs.length ? Math.round(w / xs.length) : 0 }; }).filter(b => b.sprints);
  const best = tb.sort((a, b) => b.avg - a.avg || b.sprints - a.sprints)[0] || null;
  const perStory = stories.map(s => ({ title: s.outline?.title || s.title, w: days.reduce((a, d) => a + (s.stats?.daily?.[d.k] || 0), 0) })).filter(x => x.w > 0 && x.title).sort((a, b) => b.w - a.w);
  const seeds = (Lib.seeds || []).filter(x => x.at >= weekAgo && x.status !== "discarded").slice(0, 12).map(x => ({ type: x.type, text: x.text, story: x.story, motifs: x.motifs || [] }));
  return { updatedAt: Date.now(), updatedDay: dayKey(), goal: g, words7: days.reduce((a, d) => a + d.v, 0), days: days.map(d => ({ day: d.k, words: d.v })),
    daysWritten: days.filter(d => d.v > 0).length, goalDays: days.filter(d => d.v >= g).length, longestStreak7: longest, currentStreak: streakOf(tot, g),
    sprints7: sprints.length, bestTime: best ? { ...best, basis: sprints.length ? "this week" : "all time" } : null, stories: perStory.slice(0, 5), seeds7: seeds };
}
function scheduleDigest() {
  if (Store.mode !== "db" || !Goal.loaded || !SprintLog.loaded || !Lib.loaded || loading) return;
  clearTimeout(digestTimer);
  digestTimer = setTimeout(async () => {
    const d = buildDigest(); const key = JSON.stringify({ ...d, updatedAt: 0 });
    if (key === digestLast) return;
    try { await Store.col().doc("_digest").set(d); digestLast = key; } catch {}
  }, 1500);
}


// ---------- Start a story from an image ----------
const ICON_IMAGE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';
const ideaImg = { forId: null, preview: "", blob: null, busy: false, options: null, err: "", picked: -1 };
async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("This image format can't be opened here. Try a JPG or PNG.")); i.src = url; });
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function onIdeaImage(file) {
  if (!file) return;
  Object.assign(ideaImg, { forId: story.id, busy: true, options: null, err: "", picked: -1 });
  render();
  try {
    const caps = AI.sample ? await AI.sample.limits().catch(() => null) : null;
    const blob = await shrinkImage(file);
    if (ideaImg.preview) URL.revokeObjectURL(ideaImg.preview);
    ideaImg.blob = blob; ideaImg.preview = URL.createObjectURL(blob); render();
    // Keep the image with the story (when uploads are available).
    (async () => { try { const a = await claude.use("assets"); if (a) { const r = await a.upload(blob, { type: "image/jpeg" }); story.image = { assetId: r.id, url: r.url }; persist(); } } catch {} })();
    if (!caps?.images) throw new Error(AI.sample ? "Reading images isn't available in this view. You can still keep the image with your story and type the idea yourself." : "Open the app in Claude, signed in, to have Claude read the image.");
    const lang = story.lang === "hindi" ? "Hindi in Devanagari" : "Hinglish (Hindi in Roman letters, mixed naturally with English)";
    const prompt = `A writer wants to start a story from this image. Look closely: the people, place, objects, light, era and mood, and anything odd or unresolved in it.\n\nSuggest 3 different stories this image could be the seed of: one tender, one tense or dark, one surprising. Each idea is 2–3 sentences: who the main character is, what they want, and what stands in their way, rooted in what is actually visible. Set them in India unless the image clearly shows somewhere else. Write in ${lang}.\n\nReply with JSON only: {"description": "one sentence describing what the image shows", "ideas": [{"title": "a short working title", "idea": string}]}`;
    const r = await AI.sample.json(prompt, { images: [blob], modelTier: AI.tier("default"), cache: false });
    ideaImg.options = (r?.ideas || []).slice(0, 3).map(x => ({ title: String(x.title || ""), idea: String(x.idea || "") })).filter(x => x.idea);
    story.imageNote = String(r?.description || "").slice(0, 400); persistSoon();
    if (!ideaImg.options.length) ideaImg.err = "Claude couldn't find a story in this image. Try another, or type your idea.";
  } catch (e) { ideaImg.err = e?.code ? AI.errText(e) : (e?.message || "Couldn't read that image."); }
  ideaImg.busy = false; render();
}
function useImageIdea(i) {
  const o = ideaImg.options[i]; if (!o) return;
  const prev = ideaImg.picked >= 0 ? ideaImg.options[ideaImg.picked] : null;
  if (!story.idea.trim() || (prev && story.idea.trim() === prev.idea.trim())) story.idea = o.idea;
  else story.idea = story.idea.trimEnd() + "\n\n" + o.idea;
  if (!story.title || (prev && story.title === prev.title)) story.title = o.title;
  ideaImg.picked = i; persist(); render();
}
function ideaImageBox() {
  if (ideaImg.forId !== story.id) Object.assign(ideaImg, { forId: story.id, preview: "", blob: null, busy: false, options: null, err: "", picked: -1 });
  const src = ideaImg.preview || story.image?.url || "";
  const input = h("input", { type: "file", accept: "image/*", id: "ideaimg", hidden: true, onchange: e => { onIdeaImage(e.target.files[0]); e.target.value = ""; } });
  const btn = h("label", { for: "ideaimg", class: "btn imgbtn", tabindex: "0", role: "button", onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } } },
    icon(ICON_IMAGE), src ? "Use a different image" : "Start from an image");
  return h("div", { class: "ideaimg" }, input,
    src ? h("div", { class: "ideathumb-wrap" }, h("img", { src, alt: story.imageNote || "The image this story started from", class: "ideathumb" })) : null,
    story.imageNote && src ? h("p", { class: "imgdesc", text: story.imageNote }) : null,
    h("div", { class: "row" }, btn,
      src && !ideaImg.busy ? h("button", { class: "ghost", onclick: () => { story.image = null; story.imageNote = ""; ideaImg.preview = ""; ideaImg.options = null; persist(); render(); } }, "Remove image") : null,
      !src ? h("span", { class: "muted small", text: "A photo, a painting, a frame from a film…" }) : null),
    ideaImg.busy ? h("div", { class: "busy", role: "status" }, h("span", { class: "dot" }), ideaImg.blob ? "Looking for stories in your image…" : "Opening the image…") : null,
    ideaImg.err ? h("div", { class: "note err", role: "alert", text: ideaImg.err }) : null,
    ideaImg.options?.length ? h("div", { class: "imgideas" }, h("span", { class: "label", text: "Stories in this image · tap one to use it" }),
      ideaImg.options.map((o, i) => h("button", { class: "imgidea", "aria-pressed": ideaImg.picked === i ? "true" : "false", onclick: () => useImageIdea(i) }, h("b", { text: o.title }), h("span", { text: o.idea })))) : null);
}


// ---------- Remembered rewrite notes ----------
const hasNotes = k => !!((story.notes || []).length || (parts[k]?.notes || []).length);
function saveNote(k, text, whole) {
  const n = { text: text.slice(0, 300), at: Date.now() };
  if (whole) { story.notes = [...(story.notes || []).filter(x => x.text !== n.text), n].slice(-12); persist(); }
  else if (parts[k]) { parts[k].notes = [...(parts[k].notes || []).filter(x => x.text !== n.text), n].slice(-12); }
}
async function dropNote(k, text, whole) {
  if (whole) { story.notes = (story.notes || []).filter(x => x.text !== text); persist(); }
  else if (parts[k]) { parts[k].notes = (parts[k].notes || []).filter(x => x.text !== text); await Store.savePart(story.id, parts[k]).catch(() => {}); }
  render();
}
function notesField(k, noteEl) {
  const whole = story.notes || [], mine = parts[k]?.notes || [];
  const chip = (x, w) => h("div", { class: "notechip" }, h("span", { text: x.text }), w ? h("small", { text: "All parts" }) : null,
    h("button", { "aria-label": "Remove this note", title: "Stop applying this note", onclick: () => dropNote(k, x.text, w) }, "✕"));
  return h("div", { class: "field" },
    whole.length || mine.length ? h("div", { class: "notes-kept" },
      h("span", { class: "label", text: "Notes Claude keeps following" }),
      ...whole.map(x => chip(x, true)), ...mine.map(x => chip(x, false)),
      h("p", { class: "muted small", text: "Every rewrite follows all of these. Tap ✕ to drop one." })) : null,
    h("label", { for: "rewritenote" }, whole.length || mine.length ? "Add another note (optional)" : "Rewrite note (optional)"), noteEl,
    h("label", { class: "checkline" }, h("input", { type: "checkbox", id: "noteall" }), "Use this note for all parts, including new ones"));
}

// ---------- Boot ----------
async function loadList() {
  loading = true; render();
  try { stories = await Promise.race([Store.list(), new Promise((_, rej) => setTimeout(() => rej(new Error("timed out")), 10000))]); }
  catch (e) { stories = []; msg = null; toast("Couldn't load your stories: " + (e?.code || e?.message || "error")); }
  loading = false; render();
  backfillStats();
}
render();
(async () => {
  await Promise.all([Store.init(), AI.init()]);
  loadList();
  Lib.load().then(() => { if (tab !== "stories") render(); });
  Promise.all([Goal.load(), SprintLog.load()]).then(() => { if (tab === "stories" && !story) render(); });
})();
</script>
